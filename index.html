<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0e12" />
    <title>Mantenimiento Industrial 3D</title>

    <!-- Fuentes Premium de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Importar el componente de Google Model Viewer para 3D -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="app-container">

        <!-- PANTALLA PRINCIPAL (MENÚ) -->
        <section id="screen-menu" class="screen active-screen">
            <header class="app-header">
                <div class="logo">
                    <img src="Logo.ico" alt="Logo Institucional"
                        style="width: 38px; height: 38px; border-radius: 8px; object-fit: contain;">
                    <h1>SYS<span class="highlight">MAINTENANCE</span></h1>
                </div>
                <p class="subtitle">Panel Procedimientos de Mantenimiento de Armamento</p>
            </header>

            <div class="menu-grid">
                <button class="menu-card" data-target="procedure-1">
                    <div class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="22" y1="12" x2="18" y2="12" />
                            <line x1="6" y1="12" x2="2" y2="12" />
                            <line x1="12" y1="6" x2="12" y2="2" />
                            <line x1="12" y1="22" x2="12" y2="18" />
                        </svg></div>
                    <div class="card-content">
                        <h3>1. Fusil Fx</h3>
                        <p>Desarme parcial FX05</p>
                    </div>
                </button>
                <button class="menu-card" data-target="procedure-2">
                    <div class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                            <polyline points="9 12 11 14 15 10" />
                        </svg></div>
                    <div class="card-content">
                        <h3>2. AR-15</h3>
                        <p>Desarme AR15</p>
                    </div>
                </button>
                <button class="menu-card" data-target="procedure-3">
                    <div class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <circle cx="12" cy="12" r="6" />
                            <circle cx="12" cy="12" r="2" />
                        </svg></div>
                    <div class="card-content">
                        <h3>3. HKG3</h3>
                        <p>Mantenimiento y desarme</p>
                    </div>
                </button>
                <button class="menu-card" data-target="procedure-4">
                    <div class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                        </svg></div>
                    <div class="card-content">
                        <h3>4. MINIMI MK3</h3>
                        <p>Revisión y mantenimiento</p>
                    </div>
                </button>
                <button class="menu-card" data-target="procedure-5">
                    <div class="card-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
                            <path d="M12 7v-4" />
                            <path d="M12 21v-4" />
                            <path d="M16.33 9.5l3.46 -2" />
                            <path d="M4.21 16.5l3.46 -2" />
                            <path d="M16.33 14.5l3.46 2" />
                            <path d="M4.21 7.5l3.46 2" />
                        </svg></div>
                    <div class="card-content">
                        <h3>5. MK19</h3>
                        <p>Desarme parcial MK19</p>
                    </div>
                </button>

                <!-- BOTÓN MATERIAL ADICIONAL -->
                <button class="menu-card menu-card--highlight" id="btn-go-materials">
                    <div class="card-icon card-icon--teal">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                            <line x1="12" y1="9" x2="16" y2="9"/>
                            <line x1="12" y1="13" x2="16" y2="13"/>
                            <polygon points="9 9 8 9 8 13 9 13"/>
                        </svg>
                    </div>
                    <div class="card-content">
                        <h3>Material Adicional</h3>
                        <p>Manuales PDF y videos de referencia</p>
                    </div>
                    <div class="card-badge">8</div>
                </button>

            </div>
        </section>

        <!-- PANTALLAS DE PROCEDIMIENTOS (Se rellenan dinámicamente) -->
        <section id="screen-procedure" class="screen">
            <!-- Barra superior para volver -->
            <nav class="proc-nav">
                <button id="btn-back" class="btn-back">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Atrás
                </button>
                <h2 id="proc-title">Procedimiento</h2>
            </nav>

            <!-- Renderizador 3D -->
            <div class="viewer-container">
                <model-viewer id="main-3d-viewer" src="" alt="Modelo 3D" auto-rotate camera-controls
                    shadow-intensity="1" exposure="1" environment-image="neutral" interaction-prompt="none"
                    ar ar-modes="webxr scene-viewer quick-look" loading="eager" poster="Logo.ico">
                </model-viewer>
                <div class="gradient-overlay"></div>
            </div>

            <!-- Instrucciones de Mantenimiento -->
            <div class="instructions-panel">
                <div class="panel-handle"></div>
                <div id="proc-details" class="details-content">
                    <!-- Contenido inyectado por JS -->
                </div>
            </div>
        </section>

        <!-- PANTALLA MATERIAL ADICIONAL -->
        <section id="screen-materials" class="screen">
            <nav class="proc-nav">
                <button id="btn-back-materials" class="btn-back">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Atrás
                </button>
                <h2 id="materials-screen-title" style="flex:1; text-align:right; font-family:'Outfit',sans-serif; font-size:18px; font-weight:600; color:var(--text-main); padding-left:15px;">Material Adicional</h2>
            </nav>

            <div class="materials-screen-body">

                <!-- Encabezado decorativo -->
                <div class="materials-hero">
                    <div class="materials-hero-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="materials-hero-title">Biblioteca de Recursos</h2>
                        <p class="materials-hero-sub">Manuales técnicos y material audiovisual</p>
                    </div>
                </div>

                <!-- CATEGORÍA: MANUALES PDF -->
                <div class="mat-category">
                    <div class="mat-category-header">
                        <div class="mat-category-icon mat-category-icon--pdf">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        </div>
                        <span class="mat-category-label">Manuales PDF</span>
                        <span class="mat-category-count">6 archivos</span>
                    </div>
                    <div class="mat-items-grid">
                        <!-- AR-15 -->
                        <button class="mat-item" data-src="AR 15.pdf" data-type="pdf" data-title="Manual AR-15">
                            <div class="mat-item-thumb mat-item-thumb--pdf">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                <span class="mat-item-ext">PDF</span>
                            </div>
                            <div class="mat-item-info">
                                <span class="mat-item-name">Manual AR-15</span>
                                <span class="mat-item-desc">Fusil de asalto calibre 5.56mm</span>
                            </div>
                            <div class="mat-item-arrow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </div>
                        </button>
                        <!-- Atlas FX-05 -->
                        <button class="mat-item" data-src="ATLAS FX 05.pdf" data-type="pdf" data-title="Atlas FX-05">
                            <div class="mat-item-thumb mat-item-thumb--pdf">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                <span class="mat-item-ext">PDF</span>
                            </div>
                            <div class="mat-item-info">
                                <span class="mat-item-name">Atlas FX-05</span>
                                <span class="mat-item-desc">Diagrama de partes y componentes</span>
                            </div>
                            <div class="mat-item-arrow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </div>
                        </button>
                        <!-- Manual FX-05 -->
                        <button class="mat-item" data-src="FX 05.pdf" data-type="pdf" data-title="Manual FX-05">
                            <div class="mat-item-thumb mat-item-thumb--pdf">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                <span class="mat-item-ext">PDF</span>
                            </div>
                            <div class="mat-item-info">
                                <span class="mat-item-name">Manual FX-05</span>
                                <span class="mat-item-desc">Fusil Xiuhcóatl calibre 5.56mm</span>
                            </div>
                            <div class="mat-item-arrow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </div>
                        </button>
                        <!-- FUSIL G3 -->
                        <button class="mat-item" data-src="FUSIL G3.pdf" data-type="pdf" data-title="Manual Fusil G3">
                            <div class="mat-item-thumb mat-item-thumb--pdf">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                <span class="mat-item-ext">PDF</span>
                            </div>
                            <div class="mat-item-info">
                                <span class="mat-item-name">Manual Fusil G3</span>
                                <span class="mat-item-desc">HK G3 calibre 7.62x51mm NATO</span>
                            </div>
                            <div class="mat-item-arrow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </div>
                        </button>
                        <!-- MINIMI -->
                        <button class="mat-item" data-src="minimi-762x51-mm-.pdf" data-type="pdf" data-title="Manual MINIMI 7.62">
                            <div class="mat-item-thumb mat-item-thumb--pdf">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                <span class="mat-item-ext">PDF</span>
                            </div>
                            <div class="mat-item-info">
                                <span class="mat-item-name">Manual MINIMI MK3</span>
                                <span class="mat-item-desc">Ametralladora ligera 7.62x51mm</span>
                            </div>
                            <div class="mat-item-arrow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </div>
                        </button>
                        <!-- MK19 -->
                        <button class="mat-item" data-src="Manual de ametralladora MK19.pdf" data-type="pdf" data-title="Manual MK19">
                            <div class="mat-item-thumb mat-item-thumb--pdf">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                                <span class="mat-item-ext">PDF</span>
                            </div>
                            <div class="mat-item-info">
                                <span class="mat-item-name">Manual MK19</span>
                                <span class="mat-item-desc">Lanzagranadas automático 40mm</span>
                            </div>
                            <div class="mat-item-arrow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- CATEGORÍA: VIDEOS -->
                <div class="mat-category">
                    <div class="mat-category-header">
                        <div class="mat-category-icon mat-category-icon--video">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        </div>
                        <span class="mat-category-label">Videos</span>
                        <span class="mat-category-count">2 archivos</span>
                    </div>
                    <div class="mat-items-grid">
                        <!-- Video AR-15 -->
                        <button class="mat-item" data-src="RENDER FINAL AR15 2.mp4" data-type="video" data-title="Video AR-15 — Render 3D">
                            <div class="mat-item-thumb mat-item-thumb--video">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <span class="mat-item-ext mat-item-ext--video">MP4</span>
                            </div>
                            <div class="mat-item-info">
                                <span class="mat-item-name">Video AR-15</span>
                                <span class="mat-item-desc">Render 3D animado del fusil</span>
                            </div>
                            <div class="mat-item-arrow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </div>
                        </button>
                        <!-- Video FX-05 -->
                        <button class="mat-item" data-src="RENDER FINAL fx05 armado.mp4" data-type="video" data-title="Video FX-05 — Render 3D">
                            <div class="mat-item-thumb mat-item-thumb--video">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <span class="mat-item-ext mat-item-ext--video">MP4</span>
                            </div>
                            <div class="mat-item-info">
                                <span class="mat-item-name">Video FX-05</span>
                                <span class="mat-item-desc">Render 3D animado armado</span>
                            </div>
                            <div class="mat-item-arrow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                            </div>
                        </button>
                    </div>
                </div>

                <div style="height: 40px;"></div>
            </div>
        </section>

    </div>

    <!-- MODAL PARA PDF -->
    <div id="pdf-modal" class="pdf-modal">
        <div class="pdf-modal-header">
            <h3 id="pdf-modal-title">Visor de Documento</h3>
            <button id="btn-close-pdf" class="btn-close-pdf">&times;</button>
        </div>
        <div class="pdf-modal-body">
            <iframe id="pdf-viewer" src="" frameborder="0"></iframe>
        </div>
    </div>

    <!-- MODAL PARA VIDEO -->
    <div id="video-modal" class="pdf-modal">
        <div class="pdf-modal-header">
            <h3 id="video-modal-title">Visor de Video</h3>
            <button id="btn-close-video" class="btn-close-pdf">&times;</button>
        </div>
        <div class="pdf-modal-body" style="background: black; display: flex; align-items: center; justify-content: center;">
            <video id="video-viewer" controls playsinline style="max-width: 100%; max-height: 100%;"></video>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
